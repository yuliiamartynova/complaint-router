[project]
name = "complaint-router"
version = "0.1.0"
description = "Routes consumer financial complaints to product queues (KSE MLOps course project)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yuliia Martynova" }]
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.14.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaint_router"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
